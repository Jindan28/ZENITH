<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Website - Presentations</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design.css">
</head>

<body>

    <nav>
        <a href="dashboard.html" class="brand-logo">
            <h1>ZENITH</h1>
        </a>
        
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">Home</a>
            <a href="design.html" class="active">Design</a>
            <a href="index.html">Product</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Project Presentations</h1>
        <p>Kelompok Zenith.</p>
        
        <a href="dashboard.html" class="btn-back">
            <span>&larr;</span> Back to Dashboard
        </a>
    </section>

    <div class="showcase-stack">
        
        <div class="showcase-card">
            <div class="card-header">
                <span class="slide-number">01</span>
                <h3>Presentation Part 1</h3>
            </div>
            <div class="canva-wrapper">
                <iframe loading="lazy" src="https://www.canva.com/design/DAHHG69h7SQ/ZSvgwhlyY2-Zmp_QURDZcg/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
                </iframe>
            </div>
        </div>

        <div class="showcase-card">
            <div class="card-header">
                <span class="slide-number">02</span>
                <h3>Presentation Part 2</h3>
            </div>
            <div class="canva-wrapper">
                <iframe loading="lazy" src="https://www.canva.com/design/DAHJoVOIuKo/7mQmi9z0oQ4HI7KOH6XgOA/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
                </iframe>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Zenith Team</p>
    </footer>

    <script>
        // --- 1. OTOMATIS DETEKSI HALAMAN AKTIF ---
        const currentUrl = window.location.pathname;
        const navLinksArray = document.querySelectorAll('nav .nav-links a');
        
        navLinksArray.forEach(link => {
            const hrefAttr = link.getAttribute('href');
            if (currentUrl.endsWith(hrefAttr)) {
                link.classList.add('active');
            }
        });

        // --- 2. LOGIKA HAMBURGER MENU (MOBILE) ---
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.getElementById("navLinks");

        menuToggle.addEventListener("click", function(event) {
            event.stopPropagation();
            menuToggle.classList.toggle("active");
            navLinks.classList.toggle("active");
        });

        // --- 3. KLIK DI LUAR UNTUK MENUTUP NAVBAR MOBILE ---
        window.addEventListener("click", function(event) {
            if (!navLinks.contains(event.target) && !menuToggle.contains(event.target)) {
                menuToggle.classList.remove("active");
                navLinks.classList.remove("active");
            }
        });
    </script>

</body>
</html>
